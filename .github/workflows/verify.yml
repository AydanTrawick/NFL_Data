name: Verify Every Snap
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Browser and accessibility checks
        run: |
          npm run start > /tmp/every-snap-server.log 2>&1 &
          for i in {1..30}; do curl -fsS http://localhost:3000/ > /dev/null && break || sleep 1; done
          npm run test:e2e -- --workers=2
      - name: Lighthouse landing page
        run: |
          export CHROME_PATH=$(node -e "console.log(require('playwright').chromium.executablePath())")
          npx lighthouse http://localhost:3000/ --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" --only-categories=performance,accessibility --output=json --output-path=lighthouse.json --quiet
          node scripts/check-lighthouse.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-reports
          path: |
            playwright-report/
            test-results/
            lighthouse.json
